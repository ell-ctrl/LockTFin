<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>JKUAT LOCK-IN</title>
  <link rel="manifest" href="data:application/manifest+json,{%22name%22:%22JKUAT%20LOCK-IN%22,%22short_name%22:%22LockIn%22,%22start_url%22:%22.%22,%22display%22:%22standalone%22,%22background_color%22:%22%230a0a0a%22,%22theme_color%22:%22%23c8f764%22}">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@700;800&display=swap');
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; background: #0a0a0a; color: #fff; font-family: 'Space Mono', monospace; overflow-x: hidden; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: #0a0a0a; }
    ::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 2px; }
    input[type=time]::-webkit-calendar-picker-indicator { filter: invert(1); opacity: 0.4; }
    select option { background: #111; }
    input, select, button, textarea { font-family: 'Space Mono', monospace; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useCallback } = React;

    const DAYS = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
    const UNITS = [
      "EMG 2101 – History of Technology",
      "SPH 2174 – Physics for Engineers II",
      "EMT 2132 – Materials Science",
      "EMG 2203 – Engineering Statics",
      "Other",
    ];

    const STORAGE_KEYS = {
      classes: "jkuat_classes_v2",
      attendance: "jkuat_attendance_v2",
      pdfs: "jkuat_pdfs_v2",
      customUnits: "jkuat_custom_units_v2",
    };

    const saveData = (key, value) => {
      try { localStorage.setItem(key, JSON.stringify(value)); } catch {}
    };
    const loadData = (key, fallback) => {
      try {
        const r = localStorage.getItem(key);
        return r ? JSON.parse(r) : fallback;
      } catch { return fallback; }
    };

    const genId = () => Math.random().toString(36).slice(2, 9);

    // Icons
    const IconBook = () => (
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
    );
    const IconCalendar = () => (
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
    );
    const IconPlus = () => (
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    );
    const IconTrash = () => (
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>
    );
    const IconX = () => (
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    );
    const IconSearch = () => (
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    );
    const IconFile = () => (
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
    );

    function AttendanceRing({ pct }) {
      const r = 22, circ = 2 * Math.PI * r;
      const color = pct >= 75 ? "#4ade80" : pct >= 50 ? "#facc15" : "#f87171";
      return (
        <svg width="60" height="60" viewBox="0 0 60 60">
          <circle cx="30" cy="30" r={r} fill="none" stroke="#1e1e1e" strokeWidth="5"/>
          <circle cx="30" cy="30" r={r} fill="none" stroke={color} strokeWidth="5"
            strokeDasharray={`${(pct/100)*circ} ${circ}`}
            strokeLinecap="round" transform="rotate(-90 30 30)"
            style={{ transition: "stroke-dasharray 0.5s ease" }}
          />
          <text x="30" y="35" textAnchor="middle" fill={color} style={{ fontSize: "11px", fontWeight: 700 }}>
            {Math.round(pct)}%
          </text>
        </svg>
      );
    }

    function Modal({ title, onClose, children }) {
      return (
        <div style={{
          position: "fixed", inset: 0, background: "rgba(0,0,0,0.85)",
          display: "flex", alignItems: "center", justifyContent: "center",
          zIndex: 1000, padding: "16px", backdropFilter: "blur(4px)"
        }}>
          <div style={{ background: "#111", border: "1px solid #2a2a2a", borderRadius: "12px", width: "100%", maxWidth: "440px", padding: "24px" }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: "20px" }}>
              <span style={{ color: "#e5e5e5", fontSize: "14px", fontWeight: 700 }}>{title}</span>
              <button onClick={onClose} style={{ background: "none", border: "none", color: "#666", cursor: "pointer" }}><IconX /></button>
            </div>
            {children}
          </div>
        </div>
      );
    }

    const inputStyle = {
      width: "100%", background: "#0d0d0d", border: "1px solid #2a2a2a", borderRadius: "8px", padding: "10px 12px", color: "#e5e5e5", fontSize: "13px", marginBottom: "12px", outline: "none", boxSizing: "border-box"
    };
    const labelStyle = {
      display: "block", fontSize: "11px", color: "#666", letterSpacing: "0.08em", textTransform: "uppercase", marginBottom: "6px"
    };
    const btnPrimary = {
      width: "100%", background: "#c8f764", border: "none", borderRadius: "8px", padding: "11px", color: "#0a0a0a", fontSize: "13px", fontWeight: 700, cursor: "pointer"
    };

    function AddClassModal({ onClose, onAdd, customUnits }) {
      const allUnits = [...UNITS, ...customUnits.filter(u => !UNITS.includes(u))];
      const [unit, setUnit] = useState(allUnits[0]);
      const [customUnit, setCustomUnit] = useState("");
      const [days, setDays] = useState([]);
      const [time, setTime] = useState("08:00");
      const [venue, setVenue] = useState("");

      const toggleDay = (d) => setDays(p => p.includes(d) ? p.filter(x => x !== d) : [...p, d]);
      const effectiveUnit = unit === "Other" ? customUnit : unit;

      return (
        <Modal title="ADD CLASS" onClose={onClose}>
          <label style={labelStyle}>Unit</label>
          <select value={unit} onChange={e => setUnit(e.target.value)} style={{ ...inputStyle, appearance: "none" }}>
            {allUnits.map(u => <option key={u}>{u}</option>)}
          </select>
          {unit === "Other" && <input style={inputStyle} value={customUnit} onChange={e => setCustomUnit(e.target.value)} placeholder="e.g. EMG 2205 – Drawing" />}
          <label style={labelStyle}>Days</label>
          <div style={{ display: "flex", gap: "6px", marginBottom: "12px", flexWrap: "wrap" }}>
            {DAYS.map(d => (
              <button key={d} onClick={() => toggleDay(d)} style={{
                padding: "6px 12px", borderRadius: "6px", fontSize: "12px", cursor: "pointer",
                border: days.includes(d) ? "1px solid #c8f764" : "1px solid #2a2a2a",
                background: days.includes(d) ? "rgba(200,247,100,0.12)" : "#0d0d0d",
                color: days.includes(d) ? "#c8f764" : "#666",
              }}>{d}</button>
            ))}
          </div>
          <label style={labelStyle}>Time</label>
          <input type="time" style={inputStyle} value={time} onChange={e => setTime(e.target.value)} />
          <label style={labelStyle}>Venue</label>
          <input style={inputStyle} value={venue} onChange={e => setVenue(e.target.value)} placeholder="e.g. LH3, Block C" />
          <button style={btnPrimary} onClick={() => {
            if (!effectiveUnit || days.length === 0) return;
            onAdd({ id: genId(), unit: effectiveUnit, days, time, venue });
            onClose();
          }}>SAVE CLASS</button>
        </Modal>
      );
    }

    function AddPdfModal({ onClose, onAdd, customUnits }) {
      const allUnits = [...UNITS, ...customUnits.filter(u => !UNITS.includes(u))];
      const [unit, setUnit] = useState(allUnits[0]);
      const [customUnit, setCustomUnit] = useState("");
      const [title, setTitle] = useState("");
      const [topic, setTopic] = useState("");
      const [link, setLink] = useState("");

      const effectiveUnit = unit === "Other" ? customUnit : unit;

      return (
        <Modal title="ADD PDF / RESOURCE" onClose={onClose}>
          <label style={labelStyle}>Unit</label>
          <select value={unit} onChange={e => setUnit(e.target.value)} style={{ ...inputStyle, appearance: "none" }}>
            {allUnits.map(u => <option key={u}>{u}</option>)}
          </select>
          {unit === "Other" && <input style={inputStyle} value={customUnit} onChange={e => setCustomUnit(e.target.value)} placeholder="e.g. EMG 2205" />}
          <label style={labelStyle}>Document Title</label>
          <input style={inputStyle} value={title} onChange={e => setTitle(e.target.value)} placeholder="e.g. Week 4 Lecture Notes" />
          <label style={labelStyle}>Topic / Chapter</label>
          <input style={inputStyle} value={topic} onChange={e => setTopic(e.target.value)} placeholder="e.g. Miller Indices" />
          <label style={labelStyle}>Link (optional)</label>
          <input style={inputStyle} value={link} onChange={e => setLink(e.target.value)} placeholder="Google Drive link..." />
          <button style={btnPrimary} onClick={() => {
            if (!title || !effectiveUnit) return;
            onAdd({ id: genId(), unit: effectiveUnit, title, topic, link, added: new Date().toLocaleDateString("en-GB") });
            onClose();
          }}>SAVE RESOURCE</button>
        </Modal>
      );
    }

    function LogModal({ cls, attendance, onLog, onClose }) {
      const logs = attendance[cls.id] || [];
      const attended = logs.filter(l => l.attended).length;
      const pct = logs.length ? (attended / logs.length) * 100 : 0;
      return (
        <Modal title={`ATTENDANCE · ${cls.unit.split("–")[0].trim()}`} onClose={onClose}>
          <div style={{ display: "flex", gap: "14px", background: "#0d0d0d", padding: "14px", borderRadius: "10px", marginBottom: "16px" }}>
            <AttendanceRing pct={pct} />
            <div>
              <div style={{ fontSize: "13px", color: "#e5e5e5" }}>{attended}/{logs.length} checked slots</div>
              <div style={{ fontSize: "11px", color: "#555", marginTop: "4px" }}>{cls.days.join(", ")} · {cls.time}</div>
            </div>
          </div>
          <div style={{ display: "flex", gap: "8px" }}>
            <button onClick={() => { onLog(cls.id, true); onClose(); }} style={{ ...btnPrimary, background: "#4ade80", flex: 1 }}>✓ ATTENDED</button>
            <button onClick={() => { onLog(cls.id, false); onClose(); }} style={{ ...btnPrimary, background: "#f87171", flex: 1 }}>✗ MISSED</button>
          </div>
        </Modal>
      );
    }

    function App() {
      const [tab, setTab] = useState("classes");
      const [classes, setClasses] = useState([]);
      const [attendance, setAttendance] = useState({});
      const [pdfs, setPdfs] = useState([]);
      const [customUnits, setCustomUnits] = useState([]);
      const [showAddClass, setShowAddClass] = useState(false);
      const [showAddPdf, setShowAddPdf] = useState(false);
      const [activeLogClass, setActiveLogClass] = useState(null);
      const [pdfSearch, setPdfSearch] = useState("");
      const [pdfFilter, setPdfFilter] = useState("All");
      const [loaded, setLoaded] = useState(false);

      useEffect(() => {
        setClasses(loadData(STORAGE_KEYS.classes, []));
        setAttendance(loadData(STORAGE_KEYS.attendance, {}));
        setPdfs(loadData(STORAGE_KEYS.pdfs, []));
        setCustomUnits(loadData(STORAGE_KEYS.customUnits, []));
        setLoaded(true);
      }, []);

      useEffect(() => { if (loaded) saveData(STORAGE_KEYS.classes, classes); }, [classes, loaded]);
      useEffect(() => { if (loaded) saveData(STORAGE_KEYS.attendance, attendance); }, [attendance, loaded]);
      useEffect(() => { if (loaded) saveData(STORAGE_KEYS.pdfs, pdfs); }, [pdfs, loaded]);
      useEffect(() => { if (loaded) saveData(STORAGE_KEYS.customUnits, customUnits); }, [customUnits, loaded]);

      const addClass = useCallback((cls) => {
        if (cls.unit !== "Other" && !UNITS.includes(cls.unit)) {
          setCustomUnits(p => p.includes(cls.unit) ? p : [...p, cls.unit]);
        }
        setClasses(p => [...p, cls]);
      }, []);

      const addPdf = useCallback((pdf) => {
        if (!UNITS.includes(pdf.unit)) {
          setCustomUnits(p => p.includes(pdf.unit) ? p : [...p, pdf.unit]);
        }
        setPdfs(p => [pdf, ...p]);
      }, []);

      const logAttendance = useCallback((clsId, attended) => {
        setAttendance(prev => ({
          ...prev,
          [clsId]: [...(prev[clsId] || []), { date: new Date().toLocaleDateString("en-GB"), attended }],
        }));
      }, []);

      const deleteClass = (id) => setClasses(p => p.filter(c => c.id !== id));
      const deletePdf = (id) => setPdfs(p => p.filter(f => f.id !== id));

      const allUnits = ["All", ...Array.from(new Set(pdfs.map(p => p.unit.split("–")[0].trim())))];
      const filteredPdfs = pdfs.filter(p => {
        const unitCode = p.unit.split("–")[0].trim();
        return (pdfFilter === "All" || unitCode === pdfFilter) && (!pdfSearch || p.title.toLowerCase().includes(pdfSearch.toLowerCase()));
      });

      const totalAttended = Object.values(attendance).flat().filter(l => l.attended).length;
      const totalLogged = Object.values(attendance).flat().length;
      const overallPct = totalLogged ? Math.round((totalAttended / totalLogged) * 100) : 0;

      if (!loaded) return <div style={{ minHeight: "100vh", background: "#0a0a0a", display: "flex", alignItems: "center", justifyContent: "center", color: "#c8f764" }}>LOADING...</div>;

      return (
        <div style={{ minHeight: "100vh", background: "#0a0a0a", paddingBottom: "40px" }}>
          <div style={{ borderBottom: "1px solid #1a1a1a", padding: "20px 20px 0" }}>
            <div style={{ maxWidth: "640px", margin: "0 auto" }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: "16px" }}>
                <div>
                  <div style={{ fontFamily: "'Syne', sans-serif", fontSize: "22px", fontWeight: 800, color: "#e5e5e5" }}>JKUAT <span style={{ color: "#c8f764" }}>LOCK-IN</span></div>
                  <div style={{ fontSize: "10px", color: "#444", letterSpacing: "0.1em", marginTop: "2px" }}>MECHATRONICS · SEM 2</div>
                </div>
                {totalLogged > 0 && (
                  <div style={{ textAlign: "right" }}>
                    <div style={{ fontSize: "24px", fontWeight: 700, color: overallPct >= 75 ? "#4ade80" : "#f87171" }}>{overallPct}%</div>
                    <div style={{ fontSize: "10px", color: "#444" }}>OVERALL ATT.</div>
                  </div>
                )}
              </div>
              <div style={{ display: "flex" }}>
                <button onClick={() => setTab("classes")} style={{ flex: 1, background: "none", border: "none", borderBottom: tab === "classes" ? "2px solid #c8f764" : "2px solid transparent", color: tab === "classes" ? "#c8f764" : "#444", padding: "10px 0", cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", gap: "7px" }}><IconCalendar /> CLASSES</button>
                <button onClick={() => setTab("pdfs")} style={{ flex: 1, background: "none", border: "none", borderBottom: tab === "pdfs" ? "2px solid #c8f764" : "2px solid transparent", color: tab === "pdfs" ? "#c8f764" : "#444", padding: "10px 0", cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", gap: "7px" }}><IconBook /> RESOURCES</button>
              </div>
            </div>
          </div>

          <div style={{ maxWidth: "640px", margin: "0 auto", padding: "20px" }}>
            {tab === "classes" && (
              <>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: "16px" }}>
                  <span style={{ fontSize: "11px", color: "#444" }}>{classes.length} RECURRING MODULES</span>
                  <button onClick={() => setShowAddClass(true)} style={{ background: "#c8f764", border: "none", borderRadius: "8px", padding: "8px 14px", color: "#0a0a0a", fontSize: "11px", fontWeight: 700, cursor: "pointer", display: "flex", alignItems: "center", gap: "6px" }}><IconPlus /> ADD CLASS</button>
                </div>
                {classes.length === 0 ? (
                  <div style={{ border: "1px dashed #1e1e1e", borderRadius: "12px", padding: "40px", textAlign: "center", color: "#444", fontSize: "12px" }}>No classes added yet. Tap ADD CLASS to lock in.</div>
                ) : (
                  classes.map(cls => {
                    const logs = attendance[cls.id] || [];
                    const pct = logs.length ? (logs.filter(l => l.attended).length / logs.length) * 100 : 0;
                    return (
                      <div key={cls.id} style={{ background: "#111", border: "1px solid #1e1e1e", borderRadius: "10px", padding: "14px 16px", marginBottom: "10px", display: "flex", alignItems: "center", gap: "14px" }}>
                        <AttendanceRing pct={pct} />
                        <div style={{ flex: 1, minWidth: 0 }}>
                          <div style={{ color: "#e5e5e5", fontSize: "13px", fontWeight: 700, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{cls.unit}</div>
                          <div style={{ color: "#555", fontSize: "11px", marginTop: "4px" }}>{cls.days.join(" · ")} | {cls.time} {cls.venue && `· ${cls.venue}`}</div>
                        </div>
                        <div style={{ display: "flex", gap: "6px" }}>
                          <button onClick={() => setActiveLogClass(cls)} style={{ padding: "7px 12px", background: "rgba(200,247,100,0.1)", border: "1px solid rgba(200,247,100,0.25)", borderRadius: "6px", color: "#c8f764", fontSize: "11px", cursor: "pointer", fontWeight: 700 }}>LOG</button>
                          <button onClick={() => deleteClass(cls.id)} style={{ padding: "7px 8px", background: "rgba(248,113,113,0.08)", border: "1px solid rgba(248,113,113,0.15)", borderRadius: "6px", color: "#f87171", cursor: "pointer" }}><IconTrash /></button>
                        </div>
                      </div>
                    );
                  })
                )}
              </>
            )}

            {tab === "pdfs" && (
              <>
